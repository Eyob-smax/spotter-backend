name: CI/CD

# test   → every push and pull request
# build  → pushes to the default branch: image to GHCR (tags: sha-<short>, latest)
# deploy → after build: SSH to the VPS, pull, restart, health-check, auto-rollback
#          (the VPS runs the stack as compose project `spotter` behind its existing nginx)
on:
  push:
  pull_request:
  workflow_dispatch: # manual re-deploy of the default branch

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest --cov=planner --cov-report=term-missing --cov-fail-under=95
      - name: Django deploy checks
        env:
          DEBUG: "0"
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-0123456789-abcdefghijklmnop
          ALLOWED_HOSTS: api.example.com
        run: python manage.py check --deploy --fail-level WARNING

  build:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Image name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.API_DOMAIN }}/api/docs
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/spotter' }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          # Secrets pasted through a browser can carry CRLFs or stray spaces; normalise them.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          host="$(printf '%s' "$HOST" | tr -d '[:space:]')"
          user="$(printf '%s' "$USER_NAME" | tr -d '[:space:]')"
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key (paste the whole file, BEGIN/END lines included)"
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          echo "Target user: ${user} (length ${#user})"
          printf 'Host deploy-target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n' \
            "$host" "$user" > ~/.ssh/config
          ssh deploy-target true && echo "SSH login OK"

      - name: Upload compose file
        run: scp docker-compose.prod.yml .env.example "deploy-target:$DEPLOY_PATH/"

      - name: Pull & restart (rolls back on failure)
        run: |
          # The job token can read this repo's GHCR package and expires when the job ends.
          # shellcheck disable=SC2029  # values are meant to expand on the runner
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh deploy-target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          # Runs on the server: pull the image, wait for every container's health check,
          # and restore the previously deployed image if the new one doesn't become healthy.
          # shellcheck disable=SC2029
          ssh deploy-target "IMAGE='$IMAGE' APP_DIR='$DEPLOY_PATH' bash -s" <<'DEPLOY'
          set -euo pipefail
          cd "$APP_DIR"
          export COMPOSE_FILE=docker-compose.prod.yml
          test -f .env || { echo "error: $APP_DIR/.env is missing" >&2; exit 1; }
          previous="$(cat .deployed-image 2>/dev/null || true)"
          echo "Deploying $IMAGE (previous: ${previous:-none})"

          export BACKEND_IMAGE="$IMAGE"
          docker compose pull --quiet backend
          if docker compose up -d --remove-orphans --wait --wait-timeout 120; then
            echo "$IMAGE" > .deployed-image
            # Shared host: only remove this project's old images (keep the 3 newest for rollbacks).
            docker image ls "${IMAGE%:*}" --format '{{.Repository}}:{{.Tag}}' | tail -n +4 | xargs -r docker image rm > /dev/null 2>&1 || true
            echo "Deployed $IMAGE"
            exit 0
          fi

          echo "error: $IMAGE did not become healthy" >&2
          docker compose logs --tail 80 backend >&2 || true
          if [ -n "$previous" ] && [ "$previous" != "$IMAGE" ]; then
            echo "Rolling back to $previous" >&2
            BACKEND_IMAGE="$previous" docker compose up -d --remove-orphans --wait --wait-timeout 120 || true
          fi
          exit 1
          DEPLOY

      - name: Public health check
        if: vars.API_DOMAIN != ''
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://${{ vars.API_DOMAIN }}/api/health"; then
              echo; echo "Healthy after ${attempt} attempt(s)"; exit 0
            fi
            sleep 5
          done
          echo "::error::https://${{ vars.API_DOMAIN }}/api/health did not return 200"
          exit 1

      - name: Log out of the registry on the server
        if: always()
        run: ssh deploy-target "docker logout ghcr.io" || true
