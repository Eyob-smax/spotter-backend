# Production on a shared VPS: the server's existing nginx terminates HTTPS and
# proxies the API domain to 127.0.0.1:${BACKEND_PORT}. The backend image is built
# by CI and pulled from GHCR; the deploy job sets BACKEND_IMAGE to the commit's
# tag. See "Deployment" in README.md.
name: spotter

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/eyob-smax/spotter-backend:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "0"
      REDIS_URL: redis://redis:6379/0
    ports:
      # Loopback only: reachable by nginx on this host, never directly from the internet.
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
