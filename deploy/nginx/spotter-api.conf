# nginx site for the Spotter Route API on a server that already hosts other apps.
#
#   sudo cp spotter-api.conf /etc/nginx/sites-available/spotter-api.conf
#   sudo ln -s /etc/nginx/sites-available/spotter-api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.spotter.wearecerta.app      # adds the HTTPS server block + redirect
#
# Replace the server_name if you use your own domain, and keep the port in sync
# with BACKEND_PORT in /opt/spotter/.env (default 8010).

server {
    listen 80;
    listen [::]:80;
    server_name api.spotter.wearecerta.app;

    # Route lookups for cross-country trips can take ~20 s upstream.
    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Django's rate limiting reads the client IP nginx appends here (NUM_PROXIES=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
